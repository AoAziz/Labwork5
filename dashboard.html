<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Smart Campus AI</title>
<script>try{if(localStorage.getItem("sc_theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="dashboard">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div><h1>Dashboard</h1><p>Состояние кампуса в реальном времени (имитация IoT)</p></div>
        <div class="head-actions">
          <label class="switch small-text"><input type="checkbox" id="autoToggle"> Автообновление</label>
          <button class="btn" id="simBtn">⟳ Обновить показания</button>
        </div>
      </div>

      <section class="grid kpis" id="kpis" aria-label="Ключевые показатели"></section>

      <section class="grid charts">
        <div class="card"><h3>⚡ Энергия по корпусам, кВт·ч</h3><div class="chart-box"><canvas id="energyChart"></canvas></div></div>
        <div class="card"><h3>🌡 Средняя температура (тренд)</h3><div class="chart-box"><canvas id="tempChart"></canvas></div></div>
        <div class="card"><h3>📡 Статус устройств</h3><div class="chart-box"><canvas id="deviceChart"></canvas></div></div>
      </section>

      <section class="grid two">
        <div class="card"><h3>🔔 Последние уведомления</h3><div class="alert-list" id="alertList"></div></div>
        <div class="card"><h3>🧠 Что видит AI</h3><div id="aiSummary"></div></div>
      </section>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
