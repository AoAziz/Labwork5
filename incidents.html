<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки — Smart Campus AI</title>
<script>try{if(localStorage.getItem("sc_theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="incidents">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div><h1>Заявки и инциденты</h1><p>Создание, редактирование и закрытие заявок (CRUD)</p></div>
        <div class="head-actions"><button class="btn" id="addBtn">＋ Новая заявка</button></div>
      </div>
      <div class="toolbar">
        <input type="search" id="incSearch" placeholder="Поиск по названию, помещению, ответственному…" aria-label="Поиск заявок">
        <select id="incStatus" aria-label="Статус">
          <option value="">Все статусы</option>
          <option value="open">Открыта</option>
          <option value="in_progress">В работе</option>
          <option value="resolved">Закрыта</option>
        </select>
        <select id="incPriority" aria-label="Приоритет">
          <option value="">Любой приоритет</option>
          <option value="high">Высокий</option>
          <option value="medium">Средний</option>
          <option value="low">Низкий</option>
        </select>
      </div>
      <p class="count-line" id="countLine"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>№</th><th>Заголовок</th><th>Помещение</th><th>Приоритет</th><th>Статус</th><th>Ответственный</th><th>Комментарий</th><th>Создана</th><th>Действия</th></tr></thead>
          <tbody id="incBody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="modal" id="incModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Новая заявка</h2>
    <form class="form" id="incForm" novalidate>
      <label>Заголовок<input type="text" id="fTitle" maxlength="80" placeholder="Например: Не работает проектор"></label>
      <div class="row">
        <label>Помещение<select id="fRoom"></select></label>
        <label>Приоритет
          <select id="fPriority">
            <option value="low">Низкий</option>
            <option value="medium" selected>Средний</option>
            <option value="high">Высокий</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Статус
          <select id="fStatus">
            <option value="open">Открыта</option>
            <option value="in_progress">В работе</option>
            <option value="resolved">Закрыта</option>
          </select>
        </label>
        <label>Ответственный
          <select id="fAssignee">
            <option>Администратор</option>
            <option selected>Инженер</option>
            <option>Оператор</option>
          </select>
        </label>
      </div>
      <label>Комментарий<textarea id="fComment" maxlength="300" placeholder="Подробности, что уже сделано…"></textarea></label>
      <div class="err" id="formError" role="alert"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/incidents.js"></script>
</body>
</html>
