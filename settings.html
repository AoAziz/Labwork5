<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — Smart Campus AI</title>
<script>try{if(localStorage.getItem("sc_theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="settings">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head"><div><h1>Настройки</h1><p>Тема, параметры кампуса и тестовые данные</p></div></div>
      <section class="grid settings-grid">
        <div class="card">
          <h3>Внешний вид</h3>
          <div class="field"><label class="switch"><input type="checkbox" id="themeSwitch"> Светлая тема</label></div>
          <p class="small-text">Выбор сохраняется в localStorage.</p>
        </div>

        <div class="card">
          <h3>Параметры кампуса</h3>
          <form id="settingsForm" novalidate>
            <div class="field"><label for="campusName">Название кампуса</label><input type="text" id="campusName" maxlength="40"></div>
            <div class="field"><label for="zThreshold">Порог z-score для аномалий (1.0 – 5.0)</label><input type="number" id="zThreshold" min="1" max="5" step="0.1"></div>
            <div class="field"><label class="switch"><input type="checkbox" id="autoSim"> Автообновление показаний (каждые 6 сек)</label></div>
            <div class="err" id="setError" role="alert"></div>
            <button class="btn" type="submit">Сохранить</button>
          </form>
        </div>

        <div class="card">
          <h3>Профиль</h3>
          <p id="profileInfo"></p>
          <p class="small-text">Роли — только имитация, это не настоящая защита.</p>
        </div>

        <div class="card">
          <h3>Тестовые данные</h3>
          <p class="small-text">Вернёт помещения, устройства, заявки и графики к исходному состоянию.</p>
          <button class="btn danger" id="resetBtn">Сбросить данные</button>
        </div>
      </section>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
